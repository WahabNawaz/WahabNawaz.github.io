<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>render</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Original isometric illustrations for the five services, built from simple
// rounded shapes. Same camera, light and base for all five, so they match.
// Rendered to transparent PNG by tools/render/render-services.mjs.
import * as THREE from "three";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

const id = new URLSearchParams(location.search).get("id") || "wordpress";
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;

// isometric camera
const S = 4.7;
const cam = new THREE.OrthographicCamera(-S, S, S * (H / W), -S * (H / W), 0.1, 100);
cam.position.set(10, 8.2, 10);
cam.lookAt(0, 0.9, 0);

scene.add(new THREE.HemisphereLight(0xffffff, 0xc9c2b4, 1.0));
const sun = new THREE.DirectionalLight(0xfff4e6, 2.4);
sun.position.set(-4, 10, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.radius = 9;
sun.shadow.blurSamples = 20;
sun.shadow.bias = -0.0004;
const sc = sun.shadow.camera;
sc.left = -7; sc.right = 7; sc.top = 7; sc.bottom = -7; sc.near = 1; sc.far = 30;
scene.add(sun);

// shared palette (matches the site: paper, ink, accent orange)
const C = {
  paper: "#f6f2ea", base: "#ebe4d6", edge: "#d9d0bf", ink: "#17171c", white: "#ffffff",
  line: "#d8d3ca", soft: "#efeae1", accent: "#ff6a3d",
};
const ACCENT = { wordpress: "#3d64ff", webflow: "#6b4cff", shopify: "#22a07a", framer: "#ff3d7f", php: "#ff6a3d" }[id];

const mats = {};
function mat(color, o = {}) {
  const k = color + JSON.stringify(o);
  return (mats[k] ??= new THREE.MeshPhysicalMaterial({ color, roughness: 0.55, clearcoat: 0.25, clearcoatRoughness: 0.4, ...o }));
}
function box(w, h, d, color, r = 0.12, o) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 5, Math.min(r, w / 2, h / 2, d / 2)), typeof color === "string" ? mat(color, o) : color);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function cyl(r, h, color, seg = 48, o) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, seg), mat(color, o));
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function at(obj, x, y, z, parent = scene) { obj.position.set(x, y, z); parent.add(obj); return obj; }
function textTex(text, { size = 200, color = C.ink, bg = null, font = "800 {s}px Arial Black, Arial, sans-serif", w = 512, h = 256 } = {}) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const g = c.getContext("2d");
  if (bg) { g.fillStyle = bg; g.fillRect(0, 0, w, h); }
  g.fillStyle = color; g.textAlign = "center"; g.textBaseline = "middle";
  g.font = font.replace("{s}", size);
  g.fillText(text, w / 2, h / 2 + size * 0.04);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
// flat decal on top (+Y) or front (+Z) of something
function decal(tex, w, h, face = "top") {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshStandardMaterial({ map: tex, transparent: true, roughness: 0.6 }));
  if (face === "top") m.rotation.x = -Math.PI / 2;
  if (face === "right") m.rotation.y = Math.PI / 2;
  return m;
}
// a "screen": rounded panel with a lighter face and a top bar with 3 dots
function windowPanel(w, h, { face = C.white, frame = C.ink, depth = 0.18 } = {}) {
  const g = new THREE.Group();
  g.add(box(w, h, depth, frame, 0.12));
  const scr = box(w - 0.16, h - 0.16, 0.04, face, 0.06);
  scr.position.z = depth / 2; g.add(scr);
  const bar = box(w - 0.16, 0.32, 0.05, C.soft, 0.05);
  bar.position.set(0, h / 2 - 0.08 - 0.16, depth / 2 + 0.01); g.add(bar);
  ["#ff6a3d", "#ffc23d", "#22a07a"].forEach((c, i) => {
    const d = cyl(0.06, 0.04, c, 24); d.rotation.x = Math.PI / 2;
    d.position.set(-w / 2 + 0.32 + i * 0.2, h / 2 - 0.24, depth / 2 + 0.05); g.add(d);
  });
  g.userData.face = depth / 2 + 0.03; // z of the screen surface
  g.userData.top = h / 2 - 0.4;
  return g;
}
function lines(parent, x0, y0, z, widths, gap = 0.2, color = C.line, hgt = 0.09) {
  widths.forEach((w, i) => { const b = box(w, hgt, 0.03, color, 0.04); b.castShadow = false; b.position.set(x0 + w / 2, y0 - i * gap, z); parent.add(b); });
}
function cursor(color = C.ink) {
  const s = new THREE.Shape();
  s.moveTo(0, 0); s.lineTo(0, -1.0); s.lineTo(0.26, -0.76); s.lineTo(0.46, -1.18); s.lineTo(0.62, -1.1); s.lineTo(0.42, -0.68); s.lineTo(0.76, -0.66); s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth: 0.14, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04, bevelSegments: 4 });
  g.center();
  const m = new THREE.Mesh(g, mat(color)); m.castShadow = true;
  return m;
}

// ---------- base: a soft rounded slab every illustration stands on ----------
const base = box(6.4, 0.5, 6.4, C.base, 0.24);
at(base, 0, -0.25, 0);
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.16 }));
shadowCatcher.rotation.x = -Math.PI / 2; shadowCatcher.position.y = -0.5; shadowCatcher.receiveShadow = true;
scene.add(shadowCatcher);
const accentRim = box(6.42, 0.08, 6.42, ACCENT, 0.04, { roughness: 0.4 });
at(accentRim, 0, -0.46, 0);

const builders = {
  // CMS: a site page being assembled from blocks, a plugin gear and a "W" badge
  wordpress() {
    const win = windowPanel(3.6, 2.9);
    win.rotation.y = 0; at(win, -0.5, 1.45 + 0.02, -1.3);
    const z = win.userData.face;
    const hero = box(3.0, 0.8, 0.05, ACCENT, 0.06); hero.position.set(0, 0.55, z); win.add(hero);
    lines(win, -1.5, -0.15, z, [2.2, 1.6, 2.6], 0.24);
    const img = box(0.9, 0.62, 0.05, "#c9d4ff", 0.06); img.position.set(1.0, -0.9, z); win.add(img);
    lines(win, -1.5, -0.75, z, [1.6, 1.1], 0.24);
    // blocks waiting to be placed
    const blocks = [[ACCENT, 0], [C.white, 0.62], [C.ink, 1.24]];
    blocks.forEach(([c, y], i) => at(box(1.15, 0.56, 1.15, c, 0.12), 1.85 - i * 0.05, 0.28 + y, 1.15 + i * 0.04));
    // round badge with a W
    const badge = new THREE.Group();
    const disk = cyl(0.95, 0.28, C.white); badge.add(disk);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.82, 0.06, 16, 64), mat(ACCENT)); ring.rotation.x = Math.PI / 2; ring.position.y = 0.15; badge.add(ring);
    const w = decal(textTex("W", { size: 300, color: C.ink, w: 512, h: 512 }), 1.3, 1.3); w.position.y = 0.15; badge.add(w);
    at(badge, -1.55, 0.14, 1.45);
    // gear (plugin)
    const gear = new THREE.Group();
    const gb = cyl(0.42, 0.22, C.ink, 40); gear.add(gb);
    for (let i = 0; i < 8; i++) { const t = box(0.22, 0.22, 0.2, C.ink, 0.04); const a = (i / 8) * Math.PI * 2; t.position.set(Math.cos(a) * 0.46, 0, Math.sin(a) * 0.46); t.rotation.y = -a; gear.add(t); }
    const hole = cyl(0.15, 0.24, ACCENT, 32); gear.add(hole);
    at(gear, 0.2, 0.12, 1.75);
  },

  // visual builder: a canvas with a layout grid, a selected box, style sliders and a cursor
  webflow() {
    const canvas = box(4.6, 0.16, 3.4, C.white, 0.1);
    at(canvas, -0.2, 0.08, -0.4);
    const top = 0.18;
    const g = new THREE.Group(); at(g, -0.2, top, -0.4);
    const cell = (w, d, x, z, c, h = 0.1) => { const b = box(w, h, d, c, 0.05); b.position.set(x, h / 2, z); g.add(b); return b; };
    cell(4.1, 0.5, 0, -1.2, C.soft);
    cell(2.6, 1.3, -0.72, -0.15, ACCENT, 0.22);
    cell(1.3, 1.3, 1.38, -0.15, "#ddd6ff");
    [-1.55, -0.2, 1.15].forEach((x) => cell(1.15, 0.85, x + 0.2, 1.05, C.soft));
    // selection outline with handles around the accent box
    const outline = new THREE.Mesh(new THREE.EdgesGeometry(new THREE.BoxGeometry(2.8, 0.5, 1.5)), new THREE.LineBasicMaterial({ color: "#2b6bff" }));
    outline.position.set(-0.72, 0.25, -0.15); g.add(outline);
    [[-2.12, -0.9], [0.68, -0.9], [-2.12, 0.6], [0.68, 0.6]].forEach(([x, z]) => { const h = box(0.16, 0.16, 0.16, "#2b6bff", 0.03); h.position.set(x, 0.5, z); g.add(h); });
    // style panel standing at the back right
    const panel = windowPanel(1.7, 2.6, { face: C.ink, frame: C.ink });
    panel.rotation.y = Math.PI / 2 - 0.25; at(panel, 2.45, 1.3, -0.4);
    for (let i = 0; i < 4; i++) {
      const track = box(1.2, 0.07, 0.03, "#3a3a44", 0.03); track.position.set(0, 0.5 - i * 0.45, panel.userData.face); panel.add(track);
      const knob = cyl(0.09, 0.06, i === 1 ? ACCENT : C.white, 24); knob.rotation.x = Math.PI / 2; knob.position.set(-0.5 + ((i * 0.37) % 1) * 1.0, 0.5 - i * 0.45, panel.userData.face + 0.04); panel.add(knob);
    }
    const cur = cursor(C.ink); cur.rotation.set(-Math.PI / 2 + 0.5, 0, -0.5); at(cur, 0.9, 1.25, 1.4);
  },

  // store: a shopping bag, product cards and coins
  shopify() {
    const bag = new THREE.Group();
    bag.add(box(2.0, 2.3, 1.2, ACCENT, 0.16));
    const fold = box(2.02, 0.22, 1.22, "#1b8763", 0.08); fold.position.y = 1.05; bag.add(fold);
    const handle = new THREE.Mesh(new THREE.TorusGeometry(0.5, 0.07, 16, 48, Math.PI), mat(C.ink)); handle.position.y = 1.15; handle.castShadow = true; bag.add(handle);
    const tag = decal(textTex("S", { size: 330, color: C.white, w: 512, h: 512 }), 1.25, 1.25, "front"); tag.position.set(0, -0.1, 0.61); bag.add(tag);
    at(bag, -1.3, 1.15, -0.6);
    bag.rotation.y = 0.15;
    // product cards
    [[1.0, -1.2, "#ffd9c7"], [1.7, 0.2, "#d4ecff"]].forEach(([x, z, c]) => {
      const card = new THREE.Group();
      card.add(box(1.3, 1.75, 0.14, C.white, 0.1));
      const pic = box(1.06, 0.95, 0.04, c, 0.06); pic.position.set(0, 0.28, 0.08); card.add(pic);
      lines(card, -0.53, -0.38, 0.08, [0.9, 0.55], 0.2);
      const price = box(0.5, 0.2, 0.05, C.ink, 0.06); price.position.set(-0.28, -0.72, 0.08); card.add(price);
      card.rotation.y = Math.PI / 4 - 0.1;
      at(card, x, 0.88, z);
    });
    // coins
    for (let i = 0; i < 5; i++) at(cyl(0.42, 0.13, "#ffc23d", 48, { metalness: 0.4, roughness: 0.35 }), -0.1 + (i % 2) * 0.03, 0.07 + i * 0.14, 1.6);
    at(cyl(0.42, 0.13, "#ffc23d", 48, { metalness: 0.4, roughness: 0.35 }), 0.85, 0.07, 1.9);
  },

  // design to site: stacked frames, a motion path and a pointer
  framer() {
    const frames = [["#ffd1e1", 0.0], [C.white, 0.62], [C.ink, 1.24]];
    frames.forEach(([c, y], i) => {
      const f = box(3.4 - i * 0.3, 0.14, 2.6 - i * 0.25, c, 0.12);
      at(f, -0.6 + i * 0.25, 0.25 + y + i * 0.15, -0.5 - i * 0.18);
    });
    const topY = 0.25 + 1.24 + 0.3 + 0.08;
    const g = new THREE.Group(); at(g, -0.1, topY, -0.86);
    [[-0.6, -0.35, 1.0, 0.7, ACCENT], [0.55, -0.35, 0.9, 0.7, "#ffd1e1"], [0, 0.45, 2.1, 0.45, "#3a3a44"]].forEach(([x, z, w, d, c]) => { const b = box(w, 0.08, d, c, 0.05); b.position.set(x, 0.04, z); g.add(b); });
    // motion path
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(1.4, 0.5, 2.2), new THREE.Vector3(2.4, 1.2, 1.0), new THREE.Vector3(2.0, 2.2, -0.6), new THREE.Vector3(0.6, 2.8, -1.4),
    ]);
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.045, 12), mat(ACCENT)); tube.castShadow = true; scene.add(tube);
    [0, 0.5, 1].forEach((t, i) => { const p = curve.getPoint(t); const s = new THREE.Mesh(new THREE.SphereGeometry(i === 1 ? 0.26 : 0.14, 32, 16), mat(i === 1 ? ACCENT : C.white)); s.position.copy(p); s.castShadow = true; scene.add(s); });
    const cur = cursor(C.white); cur.rotation.set(-Math.PI / 2 + 0.6, 0, -0.4); at(cur, 1.25, 0.75, 2.25);
    const outline = cursor(C.ink); outline.scale.setScalar(1.12); outline.rotation.copy(cur.rotation); at(outline, 1.25, 0.72, 2.25);
  },

  // back end: server units, a code window and a database
  php() {
    for (let i = 0; i < 3; i++) {
      const unit = new THREE.Group();
      unit.add(box(1.8, 0.62, 1.6, C.ink, 0.1));
      for (let j = 0; j < 3; j++) { const led = cyl(0.05, 0.04, j === 0 ? "#22a07a" : j === 1 ? ACCENT : "#ffc23d", 16); led.rotation.x = Math.PI / 2; led.position.set(-0.62 + j * 0.16, 0.0, 0.81); unit.add(led); }
      for (let j = 0; j < 4; j++) { const v = box(0.08, 0.36, 0.03, "#3a3a44", 0.03); v.position.set(0.2 + j * 0.16, 0, 0.8); unit.add(v); }
      at(unit, -1.7, 0.31 + i * 0.68, -0.6);
    }
    const win = windowPanel(2.9, 2.5, { face: "#1d1d24", frame: C.ink });
    win.rotation.y = -0.25; at(win, 0.85, 1.3, -1.0);
    const z = win.userData.face;
    const code = [[0.7, ACCENT], [1.6, "#8ea2ff"], [1.1, "#3a3a44"], [1.9, "#22a07a"], [0.9, "#3a3a44"], [1.4, "#8ea2ff"]];
    code.forEach(([w, c], i) => { const b = box(w, 0.1, 0.03, c, 0.04); b.castShadow = false; b.position.set(-1.15 + w / 2 + (i % 3 === 2 ? 0.25 : 0), 0.62 - i * 0.24, z); win.add(b); });
    const tag = new THREE.Group();
    tag.add(box(1.7, 0.7, 0.24, ACCENT, 0.14));
    const txt = decal(textTex("<?php", { size: 120, color: C.white, w: 512, h: 200, font: "800 {s}px Consolas, Menlo, monospace" }), 1.55, 0.6, "front"); txt.position.z = 0.13; tag.add(txt);
    tag.rotation.y = -0.25; at(tag, 1.3, 0.62, 1.2);
    tag.rotation.x = -0.05;
    // database
    for (let i = 0; i < 3; i++) {
      const d = cyl(0.6, 0.36, i === 1 ? ACCENT : C.white, 48);
      at(d, -0.9, 0.2 + i * 0.4, 1.6);
    }
  },
};

builders[id]();
renderer.render(scene, cam);
window.done = true;
</script>
</body>
</html>
